<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Chat</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #111;
  color: white;
}

.container {
  padding: 10px;
}

input, button {
  width: 100%;
  margin: 5px 0;
  padding: 10px;
}

.chat {
  display: none;
}

.msg {
  background: #222;
  margin: 5px;
  padding: 8px;
  border-radius: 5px;
}

.online {
  color: lightgreen;
}
</style>

</head>

<body>

<div class="container" id="login">

<h3>Create / Join Room</h3>

<input id="user" placeholder="Your Name">
<input id="room" placeholder="Room ID (or create)">
<input id="password" placeholder="Password">

<button onclick="createRoom()">Create Room</button>
<button onclick="join()">Join Room</button>

</div>

<div class="container chat" id="chat">

<h3>Chat</h3>

<div id="status"></div>
<div id="users"></div>

<div id="messages"></div>

<input id="msg" oninput="typing()" placeholder="Message">
<button onclick="send()">Send</button>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
