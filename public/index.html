<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat App</title>

<style>
body { margin:0; font-family:Arial; background:#121212; color:white; }

#login {
  display:flex;
  flex-direction:column;
  padding:20px;
}

#chat {
  display:none;
  height:100vh;
  display:flex;
  flex-direction:column;
}

#messages {
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.msg {
  padding:10px;
  margin:5px;
  border-radius:10px;
  max-width:70%;
}

.me { background:#4caf50; margin-left:auto; }
.other { background:#333; }

#inputArea {
  display:flex;
  padding:10px;
  background:#1e1e1e;
}

#msg {
  flex:1;
  padding:10px;
}

button {
  padding:10px;
  margin-left:5px;
}

img { max-width:200px; border-radius:10px; }

video {
  width:45%;
  margin:5px;
}
</style>
</head>

<body>

<div id="login">
  <h2>Chat App</h2>
  <input id="name" placeholder="Name">
  <input id="room" placeholder="Room">
  <button onclick="join()">Join</button>
</div>

<div id="chat">

  <div id="messages"></div>

  <div id="typing"></div>

  <div id="inputArea">
    <input id="msg" oninput="typing()">
    <button onclick="send()">Send</button>
    <button onclick="recordVoice()">🎤</button>
    <input type="file" id="file">
    <button onclick="sendFile()">📎</button>
    <button onclick="call()">📞</button>
  </div>

  <div>
    <video id="local" autoplay muted></video>
    <video id="remote" autoplay></video>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
