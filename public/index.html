<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp v3</title>

<style>
body { margin:0; font-family:Arial; background:#0f0f0f; color:white; }

#chat { display:none; padding:10px; }

.msg {
  padding:8px;
  margin:5px;
  border-radius:8px;
}

.me { background:#075e54; margin-left:auto; width:fit-content; }
.other { background:#222; width:fit-content; }

#messages { height:300px; overflow:auto; }

input, button { width:100%; padding:10px; margin:5px 0; }
</style>
</head>

<body>

<div id="login">
  <h2>WhatsApp v3</h2>

  <input id="name" placeholder="Name">
  <input id="room" placeholder="Room">

  <button onclick="join()">Join</button>

  <p id="error"></p>
</div>

<div id="chat">

  <div id="online"></div>
  <div id="system"></div>
  <div id="typing"></div>

  <div id="messages"></div>

  <input id="msg">
  <button onclick="send()">Send</button>

  <input type="file" id="file">
  <button onclick="sendFile()">File/Voice</button>

  <button onclick="call()">📞 Call</button>

  <video id="local" autoplay muted></video>
  <video id="remote" autoplay></video>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
