<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp v8</title>

<style>
body { margin:0; background:#111; font-family:Arial; color:white; }

#chat { display:none; padding:10px; }

.msg {
  padding:8px;
  margin:5px;
  border-radius:10px;
  max-width:70%;
  position:relative;
}

.me { background:#075e54; margin-left:auto; }
.other { background:#222; }

.tick { font-size:12px; color:#aaa; }

.replyBox {
  background:#333;
  padding:5px;
  font-size:12px;
}

img { max-width:150px; border-radius:10px; }

</style>
</head>

<body>

<div id="login">
  <input id="name" placeholder="Name">
  <input id="room" placeholder="Room">
  <button onclick="join()">Join</button>
</div>

<div id="chat">

  <div id="messages"></div>

  <div id="replyPreview"></div>

  <input id="msg">
  <button onclick="send()">Send</button>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
