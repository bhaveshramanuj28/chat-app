<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat v12</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0e0e0e;
  color:white;
}

/* LOGIN FIXED UI */
#login {
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.loginBox {
  width:300px;
  background:#1b1b1b;
  padding:20px;
  border-radius:12px;
  text-align:center;
}

input {
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:8px;
}

button {
  width:100%;
  padding:10px;
  background:#25d366;
  border:none;
  color:white;
  border-radius:8px;
}

/* CHAT */
#chat {
  display:none;
  height:100vh;
  flex-direction:column;
}

#topBar {
  background:#1b1b1b;
  padding:10px;
  font-size:14px;
}

#messages {
  flex:1;
  overflow:auto;
  padding:10px;
}

.msg {
  padding:10px;
  margin:6px;
  border-radius:10px;
  max-width:70%;
}

.me { background:#25d366; margin-left:auto; }
.other { background:#2b2b2b; }

.tick { font-size:11px; color:#aaa; }

#input {
  display:flex;
  padding:10px;
  background:#1b1b1b;
}

#input input {
  flex:1;
}

video {
  width:48%;
  margin:5px;
  border-radius:10px;
}
</style>
</head>

<body>

<div id="login">
  <div class="loginBox">
    <h2>Join Chat</h2>
    <input id="name" placeholder="Name">
    <input id="room" placeholder="Room">
    <button onclick="join()">Enter</button>
  </div>
</div>

<div id="chat">

  <div id="topBar">
    👥 Users: <span id="users"></span>
  </div>

  <div id="messages"></div>

  <div id="input">
    <input id="msg">
    <button onclick="send()">Send</button>
    <button onclick="call()">📞</button>
  </div>

  <video id="local" autoplay muted></video>
  <video id="remote" autoplay></video>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
