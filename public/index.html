<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat v14</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0d0d0d;
  color:white;
}

/* LOGIN */
#login {
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card {
  width:320px;
  background:#1c1c1c;
  padding:20px;
  border-radius:12px;
}

input {
  width:100%;
  padding:10px;
  margin:6px 0;
  border:none;
  border-radius:8px;
}

button {
  width:100%;
  padding:10px;
  margin-top:6px;
  background:#25d366;
  border:none;
  color:white;
  border-radius:8px;
}

/* CHAT */
#chat {
  display:none;
  height:100vh;
  flex-direction:column;
}

#messages {
  flex:1;
  overflow:auto;
  padding:10px;
}

.msg {
  max-width:70%;
  padding:10px;
  margin:6px;
  border-radius:12px;
  word-wrap:break-word;
}

.me { background:#25d366; margin-left:auto; }
.other { background:#2a2a2a; }

#input {
  display:flex;
  padding:10px;
  background:#1b1b1b;
}

#input input {
  flex:1;
  padding:10px;
  border-radius:8px;
  border:none;
}

.btn {
  width:auto;
  margin-left:5px;
}

video {
  width:48%;
  border-radius:10px;
  margin:5px;
}

#typing {
  font-size:12px;
  padding:5px 10px;
  color:#aaa;
}
</style>
</head>

<body>

<div id="login">
  <div class="card">
    <h3>Join Chat</h3>
    <input id="name" placeholder="Name">
    <input id="room" placeholder="Room">
    <button onclick="join()">Enter</button>
  </div>
</div>

<div id="chat">

  <div id="messages"></div>
  <div id="typing"></div>

  <div id="input">
    <input id="msg" placeholder="message">
    <button class="btn" onclick="send()">Send</button>
    <button class="btn" onclick="voice()">🎤</button>
    <button class="btn" onclick="call()">📞</button>
    <input type="file" id="file">
    <button class="btn" onclick="sendFile()">📎</button>
  </div>

  <video id="local" autoplay muted></video>
  <video id="remote" autoplay></video>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
