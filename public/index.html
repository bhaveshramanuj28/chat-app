<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp v7</title>

<style>
body { margin:0; font-family:Arial; background:#111; color:white; }

#chat { display:none; padding:10px; }

.msg {
  padding:8px;
  margin:5px;
  border-radius:10px;
  max-width:70%;
}

.me { background:#075e54; margin-left:auto; }
.other { background:#222; }

.tick { font-size:12px; color:#aaa; }

img { max-width:200px; border-radius:10px; }

input, button { width:100%; padding:10px; margin:5px 0; }
</style>
</head>

<body>

<div id="login">
  <h2>WhatsApp v7</h2>

  <input id="name" placeholder="Name">
  <input id="room" placeholder="Room">

  <button onclick="join()">Join</button>
</div>

<div id="chat">

  <div id="typing"></div>
  <div id="messages"></div>

  <input id="msg" oninput="typing()">
  <button onclick="send()">Send</button>

  <button onclick="recordVoice()">🎤 Voice</button>

  <input type="file" id="file">
  <button onclick="sendFile()">Send File</button>

  <button onclick="call()">📞 Call</button>

  <video id="local" autoplay muted></video>
  <video id="remote" autoplay></video>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
