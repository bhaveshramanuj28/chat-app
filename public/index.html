<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Fix</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
}

/* LOGIN */
#login {
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box {
  width:300px;
  background:#1e1e1e;
  padding:20px;
  border-radius:10px;
}

input {
  width:100%;
  padding:10px;
  margin:5px 0;
}

button {
  width:100%;
  padding:10px;
  background:#25d366;
  border:none;
  color:white;
}

/* CHAT */
#chat {
  display:none;
  height:100vh;
  flex-direction:column;
}

#messages {
  flex:1;
  overflow:auto;
  padding:10px;
}

.msg {
  padding:10px;
  margin:6px;
  border-radius:10px;
  max-width:60%;
}

.me {
  background:#25d366;
  margin-left:auto;
}

.other {
  background:#2a2a2a;
}

#input {
  display:flex;
  padding:10px;
  background:#1a1a1a;
}

#input input {
  flex:1;
  padding:10px;
}

video {
  width:48%;
  margin:5px;
}
</style>
</head>

<body>

<div id="login">
  <div class="box">
    <input id="name" placeholder="Name">
    <input id="room" placeholder="Room">
    <button onclick="join()">Join</button>
  </div>
</div>

<div id="chat">

  <div id="messages"></div>

  <div id="input">
    <input id="msg" placeholder="Message">
    <button onclick="send()">Send</button>
    <button onclick="call()">📞</button>
  </div>

  <video id="local" autoplay muted></video>
  <video id="remote" autoplay></video>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
