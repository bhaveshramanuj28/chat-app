<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat v11</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
}

#login {
  display:flex;
  flex-direction:column;
  padding:20px;
}

#chat {
  display:none;
  height:100vh;
  display:flex;
  flex-direction:column;
}

#messages {
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.msg {
  padding:10px;
  margin:6px;
  border-radius:12px;
  max-width:70%;
}

.me { background:#25d366; margin-left:auto; }
.other { background:#2a2a2a; }

#input {
  display:flex;
  padding:10px;
  background:#1a1a1a;
}

#input input {
  flex:1;
  padding:10px;
}

button {
  margin-left:5px;
  padding:10px;
}

img {
  max-width:200px;
  border-radius:10px;
}

video {
  width:48%;
  margin:5px;
  border-radius:10px;
}

#typing {
  padding:5px;
  font-size:12px;
  color:#aaa;
}
</style>
</head>

<body>

<div id="login">
  <h2>Chat App</h2>
  <input id="name" placeholder="Name">
  <input id="room" placeholder="Room">
  <button onclick="join()">Join</button>
</div>

<div id="chat">

  <div id="messages"></div>
  <div id="typing"></div>

  <div id="input">
    <input id="msg" oninput="typing()">
    <button onclick="send()">Send</button>
    <button onclick="voice()">🎤</button>
    <button onclick="call()">📞</button>
    <input type="file" id="file">
    <button onclick="sendFile()">📎</button>
  </div>

  <div>
    <video id="local" autoplay muted></video>
    <video id="remote" autoplay></video>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
